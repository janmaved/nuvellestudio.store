# Netlify configuration for Nuvéllé — one-click deploy
[build]
  publish = "public"
  command = "echo 'No build step needed — static frontend + Netlify Functions'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "#static"
  publish = "public"
  targetPort = 3000
  autoLaunch = false

# API -> serverless function (function also declares config.path = "/api/*")
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Admin panel
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# SPA clean routes -> index.html (client-side router reads the path)
[[redirects]]
  from = "/product/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
