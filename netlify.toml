# Netlify configuration for Nuvéllé — one-click deploy
[build]
  publish = "public"
  command = "echo 'No build step needed — static frontend + Netlify Functions'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "#static"
  publish = "public"
  targetPort = 3000
  autoLaunch = false

# API -> serverless function (function also declares config.path = "/api/*")
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Always fetch fresh JS/CSS so store updates show immediately (no stale cache)
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Admin panel (with and without trailing slash)
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin.html"
  status = 200

# SPA clean routes -> index.html (client-side router reads the path)
[[redirects]]
  from = "/product/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
