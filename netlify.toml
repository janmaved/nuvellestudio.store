# Netlify configuration for Nuvéllé
# NOTE: This app uses Cloudflare D1 (SQLite) for its database, which only runs on
# Cloudflare Pages/Workers. To host on Netlify you must switch the database to a
# Netlify-compatible option (e.g. Supabase / Neon Postgres via REST) — the D1
# calls in src/index.tsx would need to be swapped for that provider's client.
#
# For a one-click, zero-change deploy, Cloudflare Pages is recommended (see README).
# The static frontend (public/) can still be served by Netlify, but the /api routes
# require the database migration above.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
